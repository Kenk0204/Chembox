<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chembox</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  /* Same workbench as Gatebox and Nandbox. Chemistry world: cyan accent, warm = heat, violet = light. */
  --bg:#111417; --canvas:#101317; --panel:#171b20; --panel2:#1e2329; --raise:#262c33; --line:#29303a; --line2:#36404b;
  --text:#e4e8e3; --dim:#8a94a0; --faint:#5a6470;
  --accent:#5cc8e6; --heat:#ff9a4d; --light:#b593f2; --danger:#e8604f; --ok:#5fd38d; --link:#7fb3f5;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --side-w:330px; --insp-w:300px; --bottom-h:200px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:12.5px/1.45 var(--f-body);display:grid;grid-template-rows:36px minmax(0,1fr) 22px;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}

/* ---------- title bar ---------- */
#titlebar{display:flex;align-items:center;gap:8px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0;-webkit-user-select:none;user-select:none}
.electron-mac #titlebar{padding-left:80px;-webkit-app-region:drag}
.electron-mac #titlebar>*{-webkit-app-region:no-drag}
.electron-mac #titlebar .drag{-webkit-app-region:drag}
.brand{font:700 16px/1 var(--f-display);letter-spacing:.12em;color:var(--accent);margin-right:4px;white-space:nowrap}
.tb-sep{width:1px;height:18px;background:var(--line2);margin:0 2px}
#btnRun{display:flex;align-items:center;gap:6px;background:var(--accent);color:#04161c;border:0;border-radius:5px;padding:4px 10px;font-weight:600;white-space:nowrap}
#btnRun.on{background:var(--raise);color:var(--text);box-shadow:inset 0 0 0 1px var(--accent)}
#btnRun svg{width:12px;height:12px;fill:currentColor;stroke:none}
.tsel{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:3px 6px;max-width:210px;font-size:12px}
.tsel:hover{border-color:var(--line2)}
.tctl{display:flex;align-items:center;gap:5px;color:var(--dim);font-size:11.5px;white-space:nowrap}
.tctl input[type=range]{width:72px;accent-color:var(--heat)}
.tctl input[type=number]{width:62px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:2px 5px;font:12px var(--f-mono)}
.tbtn{background:transparent;border:1px solid transparent;border-radius:5px;padding:3px 7px;color:var(--dim);white-space:nowrap;font-size:12px}
.tbtn:hover{background:var(--panel2);color:var(--text)}
.tbtn.on{color:var(--accent);border-color:var(--accent)}
.seg{display:flex;background:#0f1115;border:1px solid var(--line);border-radius:6px;padding:2px;gap:2px}
.seg button{background:none;border:0;border-radius:4px;padding:2px 9px;color:var(--dim);font-size:12px;white-space:nowrap}
.seg button.on{background:var(--raise);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.grow{flex:1;min-width:8px;align-self:stretch}
kbd{font:10.5px var(--f-mono);background:#0f1115;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--dim);white-space:nowrap}
.tempdot{width:10px;height:10px;border-radius:50%;background:var(--heat);box-shadow:0 0 6px var(--heat)}

/* ---------- workbench ---------- */
#wb{display:flex;min-height:0;min-width:0}
#activity{width:42px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px}
#activity button{width:34px;height:34px;display:grid;place-items:center;background:none;border:0;border-radius:6px;color:var(--faint);position:relative}
#activity button:hover{color:var(--text)}
#activity button.on{color:var(--text)}
#activity button.on::before{content:"";position:absolute;left:-4px;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--accent)}
#activity .spacer{flex:1}
#side{width:var(--side-w);flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side.hidden,#insp.hidden,#bottom.hidden{display:none}
.phead{display:flex;align-items:center;gap:6px;height:30px;flex:none;padding:0 8px 0 12px;font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line)}
.phead .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{display:grid;place-items:center;width:24px;height:24px;background:none;border:0;border-radius:4px;color:var(--dim)}
.ibtn:hover{background:var(--panel2);color:var(--text)}
.ibtn svg.i{width:15px;height:15px}
.pbody{flex:1;overflow:auto;min-height:0}
.search{margin:8px;display:flex;align-items:center;gap:6px;background:#0f1115;border:1px solid var(--line);border-radius:5px;padding:4px 7px;color:var(--faint)}
.search input{flex:1;background:none;border:0;outline:none;min-width:0;color:var(--text)}
.search:focus-within{border-color:var(--accent)}
.sec{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:12px 10px 6px}
.hint{color:var(--faint);font-size:11.5px;margin:4px 10px 8px}

/* periodic table */
.ptab{display:grid;grid-template-columns:repeat(18,1fr);gap:1.5px;padding:2px 6px 6px}
.ptab .el{position:relative;aspect-ratio:1;border:0;border-radius:3px;padding:0;font:600 10px/1 var(--f-mono);color:#0d1013;background:var(--c);opacity:.92;display:grid;place-items:center;overflow:hidden}
.ptab .el:hover{opacity:1;outline:1px solid #fff}
.ptab .el.on{outline:2px solid var(--accent);outline-offset:1px;opacity:1}
.ptab .el.off{filter:saturate(.15) brightness(.45)}
.ptab .el.built::after{content:"";position:absolute;right:1px;top:1px;width:4px;height:4px;border-radius:50%;background:#0d1013}
.ptab .gap{aspect-ratio:1}
.elcard{margin:6px 10px;background:#0f1115;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.elcard .big{display:flex;align-items:baseline;gap:8px}
.elcard .big b{font:600 26px/1 var(--f-mono);color:var(--accent)}
.elcard .big span{font:600 16px var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.isos{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.isos button{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font:11px var(--f-mono);color:var(--dim)}
.isos button.on{border-color:var(--accent);color:var(--text)}
.isos button.rad{color:#ffc58f}
.mlist .m{display:flex;align-items:baseline;gap:8px;width:100%;background:none;border:0;border-radius:4px;padding:3px 10px;text-align:left;color:var(--text)}
.mlist .m:hover{background:var(--panel2)}
.mlist .m.on{background:var(--raise);box-shadow:inset 2px 0 0 var(--accent)}
.mlist .m .f{font:11px var(--f-mono);color:var(--accent);margin-left:auto;white-space:nowrap}
.plist .p{display:block;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:7px 12px;text-align:left;color:var(--text)}
.plist .p:hover{background:var(--panel2)}
.plist .p b{display:block;font-weight:600}
.plist .p span{color:var(--dim);font-size:11.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.plist .g{font:600 10.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 12px 4px}
.toc a{display:block;padding:4px 12px;color:var(--text);text-decoration:none;border-radius:4px;margin:0 4px}
.toc a:hover{background:var(--panel2)}
.toc a.on{background:var(--raise);box-shadow:inset 2px 0 0 var(--accent)}
.toc .part{font:600 10.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:12px 12px 4px}

/* ---------- center ---------- */
#center{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#view{position:relative;flex:1;overflow:hidden;touch-action:none;background:var(--canvas);outline:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#ctools{position:absolute;left:50%;transform:translateX(-50%);top:8px;display:flex;gap:2px;background:rgba(24,27,33,.94);border:1px solid var(--line);border-radius:7px;padding:3px;z-index:3;align-items:center}
#ctools .sep{width:1px;height:20px;background:var(--line2);margin:0 3px}
.tool{display:flex;align-items:center;gap:5px;background:none;border:0;border-radius:5px;padding:4px 8px;color:var(--dim);font-size:12px;white-space:nowrap}
.tool:hover{background:var(--panel2);color:var(--text)}
.tool.on{background:var(--raise);color:var(--text);box-shadow:inset 0 0 0 1px var(--accent)}
.tool svg.i{width:15px;height:15px}
.tool.heat.on{box-shadow:inset 0 0 0 1px var(--heat)}
.tool.light.on{box-shadow:inset 0 0 0 1px var(--light)}
#lampPop{position:absolute;top:46px;left:50%;transform:translateX(-50%);background:rgba(24,27,33,.97);border:1px solid var(--line);border-radius:7px;padding:8px 12px;z-index:4;display:flex;gap:12px;align-items:center;font-size:12px}
#lampPop input[type=range]{width:200px;accent-color:var(--light)}
#lampSw{width:16px;height:16px;border-radius:50%}
#hud{position:absolute;left:10px;bottom:10px;display:flex;gap:14px;background:rgba(24,27,33,.88);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font:11.5px var(--f-mono);color:var(--dim);z-index:2;pointer-events:none}
#hud b{color:var(--text);font-weight:500}
#vtools{position:absolute;right:10px;bottom:10px;display:flex;gap:2px;background:rgba(24,27,33,.92);border:1px solid var(--line);border-radius:6px;padding:2px;z-index:3}
#vtools button{background:none;border:0;border-radius:4px;padding:3px 8px;color:var(--dim);font-size:11.5px}
#vtools button.on{color:var(--accent)}
#vtools button:hover{background:var(--panel2)}
#tip{position:absolute;pointer-events:none;background:rgba(15,17,21,.95);border:1px solid var(--line2);border-radius:5px;padding:3px 7px;font-size:11.5px;z-index:5;white-space:nowrap}

/* atom lab overlay */
#labCtl{position:absolute;left:12px;top:12px;z-index:3;display:flex;flex-direction:column;gap:6px;background:rgba(24,27,33,.94);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:272px}
.prow{display:grid;grid-template-columns:22px 1fr 28px 40px 28px;align-items:center;gap:6px}
.prow .dot{width:14px;height:14px;border-radius:50%}
.prow b{font:600 22px/1 var(--f-mono);text-align:center}
.pm{background:var(--panel2);border:1px solid var(--line2);border-radius:5px;height:26px;font:600 15px/1 var(--f-mono);color:var(--text)}
.pm:hover{border-color:var(--accent)}
.pm:active{background:var(--raise)}
#labCtl .lbl{font-size:12px}
#labCtl .lbl small{display:block;color:var(--faint);font-size:10.5px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:3px 9px;font-size:12px}
.btn:hover{border-color:var(--line2)}
.btn.pri{background:var(--accent);color:#04161c;border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.row{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
#labClock{font:11.5px var(--f-mono);color:var(--dim)}
#labClock input{width:100%;accent-color:var(--light)}
#labBanner{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(24,27,33,.94);border:1px solid var(--line);border-radius:8px;padding:8px 14px;max-width:min(560px,80%);text-align:center;z-index:3;font-size:13px}
#labBanner.bad{border-color:var(--danger)}
#labBanner.good{border-color:var(--ok)}

/* docs */
#doc{position:absolute;inset:0;background:var(--bg);overflow:auto;z-index:6}
#docInner{max-width:760px;margin:0 auto;padding:28px 34px 80px;font-size:14px;line-height:1.62;color:#d6dbd4}
#docInner h1{font:600 34px/1.05 var(--f-display);letter-spacing:.03em;text-transform:uppercase;color:var(--text);margin:8px 0 14px}
#docInner h2{font:600 21px/1.15 var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--text);margin:28px 0 8px}
#docInner h3{font-size:14.5px;margin:20px 0 6px;color:var(--text)}
#docInner code{font:12.5px var(--f-mono);background:#0f1115;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--accent)}
#docInner .eq{font:13px var(--f-mono);background:#0f1115;border:1px solid var(--line);border-radius:6px;padding:8px 12px;color:var(--accent);margin:10px 0;overflow-x:auto}
#docInner table{border-collapse:collapse;margin:10px 0;font-size:13px}
#docInner td,#docInner th{border:1px solid var(--line);padding:4px 9px;text-align:left}
#docInner th{background:var(--panel2);font-weight:600}
#docInner .note{border-left:3px solid var(--accent);background:#14191e;padding:8px 12px;margin:12px 0;border-radius:0 6px 6px 0}
#docInner .ex{border:1px solid var(--line2);border-left:3px solid var(--heat);background:#18150f;padding:10px 14px;margin:16px 0;border-radius:0 6px 6px 0}
#docInner .ex b.t{display:block;font:600 15px var(--f-display);letter-spacing:.05em;text-transform:uppercase;color:var(--heat);margin-bottom:4px}
#docInner .ex details{margin-top:6px;color:var(--dim)}
#docInner .ex summary{cursor:pointer;color:var(--accent)}
#docInner a{color:var(--link)}
#docInner .try{display:inline-block;margin:4px 0;background:var(--accent);color:#04161c;border:0;border-radius:5px;padding:3px 10px;font-weight:600;font-size:12.5px}
#docInner .nav{display:flex;justify-content:space-between;margin-top:40px;border-top:1px solid var(--line);padding-top:12px}
#docClose{position:sticky;top:10px;float:right;margin:10px 10px 0 0;z-index:2}

/* ---------- bottom ---------- */
#bottom{height:var(--bottom-h);flex:none;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);min-height:0}
#bottom .tabs{display:flex;align-items:center;gap:2px;height:28px;flex:none;padding:0 6px;border-bottom:1px solid var(--line)}
#bottom .tabs button.tab{background:none;border:0;border-bottom:2px solid transparent;padding:4px 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);height:28px}
#bottom .tabs button.tab.on{color:var(--text);border-bottom-color:var(--accent)}
#bottom .tabs .info{font:10.5px var(--f-mono);color:var(--faint);margin-right:6px}
#bottomBody{flex:1;min-height:0;position:relative;overflow:auto}
#bottomBody canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
table.inv{width:100%;border-collapse:collapse;font-size:12px}
table.inv th{position:sticky;top:0;background:var(--panel);text-align:left;font:600 10.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:4px 10px;border-bottom:1px solid var(--line)}
table.inv td{padding:3px 10px;border-bottom:1px solid #1d2229;white-space:nowrap}
table.inv tr:hover td{background:var(--panel2);cursor:pointer}
table.inv tr.on td{background:var(--raise)}
table.inv .f{font:11.5px var(--f-mono);color:var(--accent)}
table.inv .n{font:11.5px var(--f-mono);text-align:right}
.ph{display:inline-flex;height:8px;width:90px;border-radius:3px;overflow:hidden;background:#0b0d10;vertical-align:middle}
.ph i{display:block;height:100%}
.ph .g{background:#7fb3f5}.ph .l{background:#5cc8e6}.ph .s{background:#e4e8e3}
.tag{font:10px var(--f-mono);border:1px solid var(--line2);border-radius:3px;padding:0 4px;color:#ffc58f}
.log{font:11.5px/1.55 var(--f-mono);padding:4px 10px}
.log .e{display:flex;gap:10px;border-bottom:1px solid #1d2229;padding:1px 0}
.log .t{color:var(--faint);min-width:64px}
.log .x{color:var(--heat)} .log .n{color:var(--accent)} .log .p{color:var(--light)} .log .d{color:#ffc58f}
.log .k{color:var(--faint);margin-left:auto}

/* ---------- inspector ---------- */
#insp{width:var(--insp-w);flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#inspBody{flex:1;overflow:auto;padding:10px 12px 16px}
#inspBody h2{font:600 20px/1.1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin:0 0 3px;text-wrap:balance}
#inspBody h4{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:16px 0 6px}
#inspBody .kind{font:11px var(--f-mono);color:var(--dim);margin-bottom:6px}
#inspBody p{margin:6px 0;color:#c9c5bb}
.props{display:grid;grid-template-columns:minmax(84px,auto) 1fr;gap:4px 8px;align-items:center;margin:8px 0}
.props label{font-size:11.5px;color:var(--dim);text-align:right}
.props input,.props select{background:#0f1115;border:1px solid var(--line);border-radius:4px;padding:3px 6px;width:100%;font-size:12px}
.props input[type=range]{padding:0;accent-color:var(--accent)}
.props input[type=checkbox]{width:auto;accent-color:var(--accent)}
.props .v{font:12px var(--f-mono)}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:12px;background:#0f1115;border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.kv span:nth-child(even){font-family:var(--f-mono);text-align:right}
.kv .tot{border-top:1px solid var(--line);padding-top:4px;margin-top:2px;font-weight:600}
.bigsym{display:flex;align-items:center;gap:12px;margin:2px 0 8px}
.bigsym .tile{width:64px;height:64px;border-radius:8px;display:grid;place-items:center;font:600 28px/1 var(--f-mono);color:#0d1013;position:relative}
.bigsym .tile small{position:absolute;left:5px;top:4px;font-size:10px}
.bigsym .tile i{position:absolute;right:5px;bottom:3px;font:10px var(--f-mono);font-style:normal}
.stab{border-radius:6px;padding:8px 10px;margin:8px 0;font-size:12.5px;border:1px solid var(--line)}
.stab.ok{background:#122219;border-color:#24563a}
.stab.rad{background:#241c10;border-color:#5d4520}
.stab.bad{background:#2a1513;border-color:#6b2a24}
.stab b{display:block;font:600 14px var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.orb{display:flex;flex-wrap:wrap;gap:8px 12px;margin:6px 0}
.orb .sub{display:flex;flex-direction:column;align-items:center;gap:2px}
.orb .boxes{display:flex;gap:1px}
.orb .bx{width:17px;height:20px;border:1px solid var(--line2);background:#0f1115;font:12px/18px var(--f-mono);text-align:center;color:var(--accent);letter-spacing:-3px}
.orb .nm{font:10.5px var(--f-mono);color:var(--dim)}
.bl{font:11.5px var(--f-mono);display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px}
.bl .est{color:#ffc58f}

/* ---------- status bar ---------- */
#statusbar{display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--panel);border-top:1px solid var(--line);font:11px var(--f-mono);color:var(--faint);white-space:nowrap;overflow:hidden}
#statusbar b{color:var(--dim);font-weight:500}
#statusbar .run{display:flex;align-items:center;gap:5px}
#statusbar .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
#statusbar .dot.on{background:var(--ok);box-shadow:0 0 5px var(--ok)}
#statusbar a{color:var(--dim);cursor:pointer;text-decoration:none}
#statusbar a:hover{color:var(--text)}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--raise);border:1px solid var(--line2);border-radius:7px;padding:7px 14px;font-size:12.5px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:70vw;text-align:center}
#toast.on{opacity:1}
.rz{flex:none;width:4px;margin:0 -2px;cursor:col-resize;z-index:5;position:relative}
.rz:hover,.rz.active{background:var(--accent);opacity:.5}
.rz.h{width:auto;height:4px;margin:-2px 0;cursor:row-resize}
.rz.hidden{display:none}
</style>
</head>
<body>
<div id="titlebar">
  <span class="brand drag">CHEMBOX</span>
  <div class="seg" id="segMode"><button data-m="lab">Atom lab</button><button data-m="box" class="on">Reaction box</button></div>
  <span class="tb-sep"></span>

    return { v: 1, W: this.W, H: this.H, t: this.t, atoms: a, bonds: this.bonds.map(b => [b.i, b.j, b.o]), wall: { ...this.wall }, burner: { ...this.burner },
      gravity: this.gravity, lamp: { ...this.lamp }, warp: this.warp, eaScale: this.eaScale };

  static load(d) {
    const b = new Box(d.W, d.H); Object.assign(b.wall, d.wall || {}); Object.assign(b.burner, d.burner || {}); Object.assign(b.lamp, d.lamp || {});
    b.gravity = !!d.gravity; b.warp = d.warp || 0; b.eaScale = d.eaScale || 1; b.t = d.t || 0;
    for (const [s, A, x, y, vx, vy] of d.atoms) b.addAtom(s, x, y, { A, vx, vy });
    for (const [i, j, o] of d.bonds) b.bond(i, j, o);

const _commonA = {};
function commonIsotope(z) {   // the most abundant natural isotope (or the longest-lived one for radioactive elements)
  if (_commonA[z]) return _commonA[z];
  let best = null, bl = null;
  for (const k in ISO) { const s = ISO[k]; if (s.z !== z) continue;
    if (s.ab && (!best || s.ab > best.ab)) best = s;
    if (!s.ab && s.hl && (!bl || s.hl > bl.hl)) bl = s; }
  const e = ELZ[z]; return (_commonA[z] = best ? best.a : bl ? bl.a : Math.round(e.m || 2 * z));
}
function findCycle(n, nb) {
  const par = new Array(n).fill(-2);
  for (let s = 0; s < n; s++) {
    if (par[s] !== -2) continue; par[s] = -1; const st = [s];
    while (st.length) {
      const a = st.pop();
      for (const [b] of nb[a]) {
        if (b === par[a]) continue;
        if (par[b] === -2) { par[b] = a; st.push(b); continue; }
        // back edge a-b: walk both up to their common ancestor
        const pa = [], seen = new Map(); for (let u = a; u !== -1; u = par[u]) { seen.set(u, pa.length); pa.push(u); }
        const pb = []; let u = b; while (!seen.has(u)) { pb.push(u); u = par[u]; if (u === -1) break; }
        if (u === -1) continue;
        return pa.slice(0, seen.get(u) + 1).concat(pb.reverse());
      }
    }
  }
  return null;
}
function gauss() { let u = 0, v = 0; while (u === 0) u = Math.random(); while (v === 0) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

function fillBox(b, smi, n, T, o = {}) {
  const g = parseSmiles(smi); let placed = 0;
  const x0 = o.x0 || 0, x1 = o.x1 || 1, y0 = o.y0 || 0, y1 = o.y1 || 1, gap = o.gap || 4.2;
  for (let k = 0; k < n; k++) {
    for (let t = 0; t < 300; t++) {
      const x = 4 + (x0 + Math.random() * (x1 - x0)) * (b.W - 8), y = 4 + (y0 + Math.random() * (y1 - y0)) * (b.H - 8);
      if (b.clearAt(x, y, gap)) { if (g.atoms.length === 1) b.addAtom(g.atoms[0].s, x, y, { T, A: o.A || g.atoms[0].a || undefined }); else b.addMolecule(g, x, y, { T }); placed++; break; }
    }
  }
  return placed;
}

<script>
/* ===== Chembox manual ===== */
const ex = (n, title, body, ans) => `<div class="ex"><b class="t">Exercise ${n} · ${title}</b>${body}${ans ? `<details><summary>What you should see</summary>${ans}</details>` : ''}</div>`;
const tryP = (id, t) => `<button class="try" data-preset="${id}">${t || 'Open this experiment'}</button>`;
const tryL = (z, n, t, e) => `<button class="try" data-lab="${z},${n}"${e != null ? ` data-e="${e}"` : ''}>${t}</button>`;
const DOCS = [
{ id: 'welcome', part: 'Start', title: 'Welcome to Chembox', html: `
<p>Chembox is the third workbench in the series, after Gatebox (sound from blocks) and Nandbox (computers from NAND gates). This time the blocks are <b>particles</b>. You build atoms from protons, neutrons and electrons, then drop atoms into a box and watch them bond, burn, glow and decay on their own.</p>
<p>Nothing in Chembox is a list of "if A meets B, make C". Reactions happen because of a few rules about energy, and those rules use <b>real measured numbers</b>: the masses and half-lives of 3,557 nuclei, ionization energies, bond energies and bond lengths. If something reacts in Chembox, it's because the energy works out, the same reason it reacts in real life.</p>
<h2>Two benches</h2>
<table><tr><th>Atom lab</th><td>One atom, close up. Add or remove protons, neutrons and electrons. Find out which nuclei hold together, which are radioactive, and how electrons arrange themselves.</td></tr>
<tr><th>Reaction box</th><td>Hundreds of atoms moving in a box a few billionths of a metre wide. Heat them, spark them, shine light on them, and watch molecules form and break.</td></tr></table>
<p>Switch with the buttons at the top left, or press <kbd>L</kbd> and <kbd>B</kbd>.</p>
<h2>How to read this manual</h2>
<p>The chapters go from the smallest things up: particles → atoms → bonds → reactions. Every chapter has exercises you do in the app, and each exercise only uses ideas explained before it. Answers are hidden under "What you should see".</p>
<div class="note">Chembox is a model, and Chapter <a href="#" data-doc="model">How Chembox works</a> lists honestly what is real, what is simplified and what isn't simulated at all. The biggest simplification: the box is flat (2D).</div>
<p>Start with <a href="#" data-doc="quick">Your first reaction</a>.</p>` },

{ id: 'quick', part: 'Start', title: 'Your first reaction', html: `
<p>Hydrogen and oxygen gas are a famous dangerous mixture: a single spark turns them into water with a bang. Let's do it.</p>
${tryP('h2o2')}
<ol><li>The box holds 40 hydrogen molecules (H₂, two white atoms) and 20 oxygen molecules (O₂, two red atoms joined by a double line). Press <b>Run</b> (or <kbd>Space</kbd>).</li>
<li>They fly around and bounce off each other, but nothing happens. Leave it running for a while. Still nothing.</li>
<li>Pick the <b>Spark</b> tool (<kbd>4</kbd>) and click in the middle of the gas.</li>
<li>Watch the <b>Contents</b> tab at the bottom, and the temperature in the corner.</li></ol>
<p>The spark breaks a few bonds. The loose atoms are extremely reactive (they're called radicals, see <a href="#" data-doc="bonds">Chemical bonds</a>). They attack the molecules around them, each attack makes another loose atom, and every reaction that makes water releases heat, which speeds everything up. That's a chain reaction, and it's how flames work.</p>
${ex(1, 'Count the water', `<p>After the spark, keep running until the temperature stops rising. Open the <b>Graph</b> tab. Which line goes down and which goes up?</p>`, `<p>H₂ and O₂ go down, H₂O goes up, and the temperature jumps by thousands of degrees. Some OH, H and O are left over: at very high temperature water itself starts falling apart again.</p>`)}
${ex(2, 'Why didn\'t it start on its own?', `<p>Press <b>Reset</b>. This time don't spark: set the temperature (top bar) to 1500 K and pick "Heat bath (whole box)". Run for a while.</p>`, `<p>Usually still nothing, at least for many picoseconds. Even at 1500 K, very few collisions are hard enough to break an H–H or O=O bond. In real life a mixture at 1500 K ignites within a fraction of a millisecond, but that is still millions of times longer than Chembox can show you. The spark skips the waiting.</p>`)}` },

{ id: 'particles', part: 'Atoms', title: 'Protons, neutrons and electrons', html: `
<p>Every atom is made of three kinds of particle:</p>
<table><tr><th></th><th>Charge</th><th>Mass</th><th>Where</th></tr>
<tr><td><span style="color:#e8604f">●</span> proton</td><td>+1</td><td>1 (about)</td><td>nucleus</td></tr>
<tr><td><span style="color:#a9b1bb">●</span> neutron</td><td>0</td><td>1 (about)</td><td>nucleus</td></tr>
<tr><td><span style="color:#5cc8e6">●</span> electron</td><td>−1</td><td>1/1836</td><td>around the nucleus</td></tr></table>
<p>The masses are in <b>atomic mass units</b> (u). One u is about 1.66 × 10⁻²⁷ kg, roughly the mass of one proton.</p>
<p>The protons and neutrons are packed into a tiny <b>nucleus</b> in the middle. The electrons are attracted to the positive nucleus and stay around it. Almost all of an atom's mass is in the nucleus, but almost all of its size is electrons: if the nucleus were a marble, the atom would be a football stadium.</p>
<h2>Opposite charges attract</h2>
<p>Positive and negative charges pull on each other; two charges of the same sign push apart. That one rule explains why electrons stay with a nucleus, why protons in a nucleus want to fly apart (all positive), and, later in this manual, why molecules stick together.</p>
${tryL(1, 0, 'Open the Atom lab with one proton')}
${ex(3, 'Hydrogen', `<p>In the Atom lab, press <b>Clear</b>, then add one proton. Then add one electron.</p>`, `<p>One proton is already an element: hydrogen. It is listed as an ion until you add the electron, because 1 proton (+1) and 0 electrons give a total charge of +1. With one electron the charges cancel: a neutral hydrogen atom, the most common atom in the universe.</p>`)}` },

{ id: 'elements', part: 'Atoms', title: 'Elements and isotopes', html: `
<p><b>The number of protons decides which element an atom is.</b> 1 proton is hydrogen, 6 is carbon, 8 is oxygen, 79 is gold. This number is the <b>atomic number</b>, Z. The periodic table is simply all the elements in order of Z.</p>
<p><b>The number of neutrons decides the isotope.</b> Carbon always has 6 protons, but it can have 6, 7 or 8 neutrons (and more). These are carbon-12, carbon-13 and carbon-14. The number after the name is the <b>mass number</b>, A = protons + neutrons. It's also written as a small number in front: ¹²C, ¹⁴C.</p>
<p>Isotopes of the same element behave almost the same in chemistry, because chemistry is about electrons, and the electrons only "see" the protons' charge. What changes is the mass, and whether the nucleus is stable.</p>
${ex(4, 'Three carbons', `<p>${tryL(6, 6, 'Build carbon-12')} Then press <b>+</b> on neutrons twice. Watch the card in the inspector after each click.</p>`, `<p>Carbon-12 (98.9% of all carbon) and carbon-13 (1.1%) are stable. Carbon-14 is radioactive with a half-life of 5,700 years: it is made in the upper atmosphere and is what radiocarbon dating measures.</p>`)}
${ex(5, 'Change the element', `<p>Start from carbon-12 and press <b>+</b> on protons once, without touching anything else. What did you make?</p>`, `<p>7 protons is nitrogen. With 6 neutrons it's nitrogen-13, which is radioactive (10 minutes). Adding a proton changes the element entirely. That's why the old alchemists' dream (lead into gold) is a nuclear problem, not a chemical one.</p>`)}
<p>In the <b>Nuclide chart</b> tab (bottom panel in the Atom lab) every known nucleus is a square: protons up, neutrons across. White squares are stable. Click any square to build it.</p>` },

{ id: 'nucleus', part: 'Atoms', title: 'What holds a nucleus together', html: `
<p>A nucleus is a strange thing: it's full of protons, which repel each other, and yet it doesn't fly apart. Something stronger is holding it: the <b>strong nuclear force</b>. It pulls protons and neutrons together, but only when they're practically touching. The electric repulsion between protons reaches much further.</p>
<p>So a nucleus is a balance. Neutrons help: they add strong-force "glue" without adding any repulsion. Light nuclei like carbon are happy with about as many neutrons as protons; heavy ones like lead need about 1.5 times as many.</p>
<h2>Binding energy and E = mc²</h2>
<p>Here is something you can check in the inspector: a nucleus <b>weighs less than the protons and neutrons it's made of</b>. Helium-4 is 2 protons + 2 neutrons, but it weighs 0.03 u less than those four particles apart. The missing mass became energy when the nucleus formed (Einstein's E = mc²). That energy is the <b>binding energy</b>, and it's what you'd have to pay to pull the nucleus apart again. Nuclear energy is measured in MeV (million electron-volts); one MeV is about 100 million kJ per mole, millions of times more than any chemical bond.</p>
<p>The <b>Binding energy</b> tab plots binding energy per particle for every nucleus. It rises steeply, peaks around iron and nickel, then slowly falls. That's why the Sun can get energy by joining light nuclei (fusion), and a nuclear reactor by splitting heavy ones (fission): both move toward the peak.</p>
<h2>Too many, too few</h2>
<p>Add too many neutrons and the last one isn't held at all: it drips straight off. Add too many protons and their repulsion pushes one out. These limits are the <b>drip lines</b>. Between them and the stable nuclei lies a wide band of radioactive ones.</p>
<p>Where no measurement exists, Chembox estimates binding energy with the <b>semi-empirical mass formula</b>, a five-term formula that treats the nucleus like a drop of liquid. Estimated values are marked with *.</p>
${ex(6, 'Find the drip line', `<p>${tryL(8, 8, 'Build oxygen-16')} Keep pressing <b>+</b> on neutrons, one at a time, reading the inspector each time. When does it stop being bound?</p>`, `<p>Oxygen-17 and 18 are stable, 19 to 24 are radioactive with shorter and shorter half-lives (oxygen-24: 77 milliseconds). Oxygen-25 is different: the extra neutron isn't really held, and it falls off after about 10⁻²¹ seconds. Oxygen-24 is the heaviest truly bound oxygen, so the neutron drip line for oxygen sits right there. Keep going and Chembox switches to estimates, which soon say the nucleus can't hold together at all.</p>`)}
${ex(7, 'No protons', `<p>Press <b>Clear</b> and add two neutrons.</p>`, `<p>Two neutrons alone aren't bound. Without protons there is no nucleus. One neutron on its own exists, but it's radioactive: in about ten minutes it turns into a proton.</p>`)}` },

{ id: 'decay', part: 'Atoms', title: 'Radioactive decay', html: `
<p>An unstable nucleus eventually changes into a more stable one by throwing something out. The main ways:</p>
<table><tr><th>Mode</th><th>What happens</th><th>Result</th></tr>
<tr><td>beta-minus (β⁻)</td><td>a neutron turns into a proton, shooting out an electron and an antineutrino</td><td>Z + 1 (next element)</td></tr>
<tr><td>beta-plus (β⁺)</td><td>a proton turns into a neutron, shooting out a positron (anti-electron) and a neutrino</td><td>Z − 1</td></tr>
<tr><td>electron capture</td><td>the nucleus swallows one of its own inner electrons; a proton becomes a neutron</td><td>Z − 1</td></tr>
<tr><td>alpha (α)</td><td>throws out a helium-4 nucleus (2 protons + 2 neutrons)</td><td>Z − 2, A − 4</td></tr>
<tr><td>fission</td><td>splits into two smaller nuclei and a few neutrons</td><td>two new elements</td></tr></table>
<p>Too many neutrons usually means β⁻; too many protons means β⁺ or electron capture; very heavy nuclei mostly do α.</p>
<h2>Half-life</h2>
<p>You can't predict when one nucleus will decay; it's pure chance. But every isotope has a fixed <b>half-life</b>: the time after which half of a large pile of them will have decayed. After two half-lives a quarter is left, after three an eighth, and so on. Half-lives range from far less than a billionth of a second to many times the age of the universe. Chembox uses the measured half-life and the measured mix of decay modes for each isotope.</p>
<p>Real half-lives are far too long to watch, so the Atom lab has a <b>nuclear clock</b> slider. At ×10⁹, one second on screen is about 30 years.</p>
${ex(8, 'Watch carbon-14 decay', `<p>${tryL(6, 8, 'Build carbon-14')} Set the nuclear clock to ×10¹¹ and wait. Note the elapsed time when it decays. Press the button again and repeat a few times.</p>`, `<p>It becomes nitrogen-14 by beta-minus decay: one neutron became a proton (and an electron flew out). The time is different every time: sometimes a few hundred years, sometimes over ten thousand. If you averaged many tries, half would decay before 5,700 years.</p>`)}
${ex(9, 'The uranium chain', `<p>${tryL(92, 146, 'Build uranium-238')} Set the clock to ×10¹⁷ and watch the <b>Decay log</b> tab. Raise the clock when it gets stuck.</p>`, `<p>Uranium-238 (half-life 4.5 billion years) goes through 14 decays (8 alpha, 6 beta) via thorium, radium, radon and polonium, and ends at lead-206, which is stable. Some steps take minutes, some hundreds of thousands of years. This chain is why uranium ores contain lead, and how rocks are dated.</p>`)}
${ex(10, 'Never seen', `<p>${tryL(6, 2, 'Build carbon-8')} Then remove neutrons until there are none.</p>`, `<p>Carbon-8 exists for about 3.5 × 10⁻²¹ seconds before throwing out protons. With fewer neutrons there is nothing left to hold six protons together, and they fly apart immediately.</p>`)}` },

{ id: 'electrons', part: 'Atoms', title: 'Electron shells and orbitals', html: `
<p>Electrons don't orbit the nucleus like planets; they're spread out in clouds called <b>orbitals</b>. But a simple picture works well: electrons live in <b>shells</b> at increasing distances from the nucleus, numbered n = 1, 2, 3... (the rings in the Atom lab).</p>
<p>Each shell is divided into <b>subshells</b> named s, p, d and f, made of 1, 3, 5 and 7 orbitals. Each orbital holds at most <b>two</b> electrons. So an s subshell holds 2, p holds 6, d holds 10, f holds 14.</p>
<h2>Filling order</h2>
<p>Electrons fill the lowest-energy places first. The order is 1s, 2s, 2p, 3s, 3p, 4s, 3d, 4p, 5s... (notice 4s before 3d). The inspector writes the result as a <b>configuration</b>: oxygen is 1s² 2s² 2p⁴, meaning 2 electrons in 1s, 2 in 2s and 4 in 2p.</p>
<p>Inside a subshell, electrons first spread out one per orbital, and only then pair up (Hund's rule). The orbital boxes in the inspector show this with arrows; two electrons sharing a box are drawn ↑↓ because they spin in opposite directions.</p>
<p>A few elements break the simple order (chromium and copper, for example). Chembox uses the measured configurations for neutral atoms, so you'll see those exceptions.</p>
${ex(11, 'Fill up to neon', `<p>${tryL(1, 0, 'Start with hydrogen')} Add one proton and one electron at a time (and a neutron or two to keep the nucleus stable) up to 10 protons. Watch the orbital boxes.</p>`, `<p>Helium fills 1s. Lithium starts the second shell. Carbon has 2p² with two separate unpaired electrons, nitrogen has three unpaired, oxygen starts pairing. Neon (10) fills the second shell completely: 1s² 2s² 2p⁶.</p>`)}
<h2>Valence electrons</h2>
<p>The electrons in the outermost shell are the <b>valence electrons</b>. They're the only ones that take part in chemistry. Atoms are most stable with a full outer shell, like the noble gases (helium, neon, argon). Other atoms get there by sharing electrons with neighbours. That's a chemical bond, and it's why the number of bonds an atom makes is predictable: carbon has 4 valence electrons and needs 4 more, so it makes 4 bonds; oxygen has 6 and makes 2; hydrogen has 1 and makes 1.</p>` },

{ id: 'ions', part: 'Atoms', title: 'Ions and ionization energy', html: `
<p>An atom with more or fewer electrons than protons has a net charge: it's an <b>ion</b>. Fewer electrons means positive (a cation), more electrons means negative (an anion).</p>
<p>Pulling an electron off an atom always costs energy: the <b>ionization energy</b>. The Atom lab tells you exactly how much, using measured values. Energies this size are given in electron-volts (eV); 1 eV per atom is 96.5 kJ per mole.</p>
${ex(12, 'Easy and hard electrons', `<p>${tryL(11, 12, 'Build sodium-23')} Remove electrons one at a time and read the cost each time (bottom of the inspector).</p>`, `<p>The first electron costs only 5.1 eV: it's the lone electron in the third shell. The second costs 47 eV, nine times more, because it comes from the full second shell, close to the nucleus. That's why sodium is almost always found as Na⁺, never Na²⁺.</p>`)}
${ex(13, 'Chlorine wants one more', `<p>${tryL(17, 18, 'Build chlorine-35')} Add one electron, then try to add another.</p>`, `<p>The first extra electron releases 3.6 eV (chlorine's electron affinity): Cl⁻ has a full outer shell, like argon. The second won't stay: the ion's negative charge pushes it away. Sodium gives up an electron easily and chlorine takes one gladly. Keep that in mind for table salt.</p>`)}
<div class="note">The Reaction box doesn't simulate whole ions (see <a href="#" data-doc="model">How Chembox works</a>). Instead, bonds between atoms that pull on electrons differently get partial charges, which covers salt crystals and why water is sticky.</div>` },

{ id: 'box', part: 'Bonds', title: 'The reaction box', html: `
<p>Switch to the Reaction box (<kbd>B</kbd>). Everything you see is to scale in space, but slowed down enormously in time:</p>
<table><tr><th>Size</th><td>the box is 90 × 56 Å. One ångström (Å) is 10⁻¹⁰ m; a hydrogen molecule is 0.74 Å long.</td></tr>
<tr><th>Time</th><td>measured in picoseconds (ps, 10⁻¹² s) and femtoseconds (fs, 10⁻¹⁵ s). A bond vibrates once every 8–30 fs. "Normal" speed shows about 2 ps per second, a slow-down of about 500 billion times.</td></tr>
<tr><th>Energy</th><td>kJ/mol: the energy for one mole (6 × 10²³) of whatever is happening, the unit chemists use.</td></tr></table>
<h2>Temperature is motion</h2>
<p>Atoms are always moving. <b>Temperature is just how fast they move on average.</b> Hotter = faster; at absolute zero (0 K = −273 °C) they'd stop. The box shows temperature in kelvin; room temperature is about 300 K.</p>
<p>At any temperature, speeds are spread out: most atoms are near average, a few are much faster. Those rare fast collisions are what make reactions possible (see <a href="#" data-doc="reactions">Why reactions need a push</a>).</p>
<p>Switch the colour mode (bottom right) to <b>Speed</b> to see each atom coloured by how fast it's moving.</p>
<h2>The walls</h2>
<table><tr><th>Walls hold temperature</th><td>atoms bouncing off a wall leave with speeds matching the wall temperature. Heat flows in or out only at the walls.</td></tr>
<tr><th>Heat bath</th><td>the whole box is gently nudged toward the temperature: like a test tube in a big water bath.</td></tr>
<tr><th>Insulated</th><td>no heat in or out. Total energy is exactly conserved (see the inspector).</td></tr></table>
${ex(14, 'Hot and cold', `<p>${tryP('empty', 'Open the empty box')} Choose Elements → Ar (argon), use the Add tool and click about 30 times. Run. Set the walls to 50 K, then 3000 K, with colour mode on Speed.</p>`, `<p>At 50 K the argon atoms slow down and clump into a little liquid or solid drop. At 3000 K they fly everywhere. Argon never reacts with anything; this is pure motion.</p>`)}
<div class="note">The box is flat: atoms move in two directions, not three. Molecules are drawn flattened, the way you'd draw them on paper. This makes things a bit different from reality, e.g. flames get hotter (<a href="#" data-doc="heat">Heat and energy</a>).</div>` },

{ id: 'bonds', part: 'Bonds', title: 'Chemical bonds', html: `
<p>A <b>covalent bond</b> is a pair of electrons shared between two atoms; both atoms count it toward a full outer shell. Each atom has a number of bonds it normally makes, its <b>valence</b>: H 1, O 2, N 3, C 4. A double bond (=) shares two pairs and counts twice, a triple (≡) three times.</p>
<h2>Radicals</h2>
<p>An atom that hasn't used all its bonds has unpaired electrons. Chemists call it a <b>radical</b>, and it's very reactive. Chembox draws the free bonds as little cyan dots around the atom. Two radicals that meet bond immediately, no push needed.</p>
${ex(15, 'Build methane by hand', `<p>Empty box, running. Add one C atom (Elements → C). Switch to H and add one hydrogen a few ångströms away. With the Grab tool, drag the H onto the carbon and hold it there for a second before letting go. Do the same with three more hydrogens, one at a time.</p>`, `<p>Each H bonds to the carbon until C has 4 bonds and no dots are left: CH₄, methane. A fifth H just bounces off: the carbon is full. If you let go of a hydrogen too early, the new bond may shake itself apart again; holding it lets your hand soak up the released energy (see <a href="#" data-doc="heat">the third body</a>).</p>`)}
<h2>Bond energy and length</h2>
<p>Every bond has an <b>energy</b>: what it costs to pull the two atoms apart, released again when they bond. Select a molecule to see each bond's energy and length:</p>
<table><tr><th>Bond</th><th>Energy (kJ/mol)</th><th>Length</th></tr><tr><td>H–H</td><td>436</td><td>0.74 Å</td></tr><tr><td>O–H</td><td>463</td><td>0.96 Å</td></tr><tr><td>C–H</td><td>413</td><td>1.09 Å</td></tr><tr><td>O=O</td><td>495</td><td>1.21 Å</td></tr><tr><td>N≡N</td><td>945</td><td>1.10 Å</td></tr><tr><td>Cl–Cl</td><td>242</td><td>1.99 Å</td></tr></table>
<p>(Common bonds use measured lengths; the rest are added up from tables of atom sizes, usually within 5–10%.)</p>
<p>Between two atoms, the energy follows a curve called the <b>Morse potential</b>: very steep if you push them closer than the bond length, a valley at the bond length, then a long climb as you pull them apart, flattening out at the bond energy. A bonded pair rolls back and forth in that valley: that's the vibration you see. If it gets more energy than the valley is deep, it climbs out and the bond breaks.</p>
<div class="eq">V(r) = D · [(1 − e^(−a(r − r₀)))² − 1]   D = bond energy, r₀ = bond length</div>
${ex(16, 'Bonds release heat', `<p>${tryP('radicals')} Watch the temperature at the very start.</p>`, `<p>The free atoms snap together and the temperature jumps. Every new bond releases its energy as motion. That's what makes a reaction <b>exothermic</b> (heat-releasing). The heat bath slowly cools things back down.</p>`)}
${ex(17, 'Pull one apart', `<p>Add a single H₂ molecule (Molecules → Hydrogen) to an empty box. With the Grab tool, drag one hydrogen away slowly, then fast.</p>`, `<p>Drag gently and the molecule follows like it's on a spring. Pull hard enough and the bond snaps: two H atoms with dots appear. Let go near each other and they snap back together.</p>`)}` },

{ id: 'polar', part: 'Bonds', title: 'Charges and sticking together', html: `
<p>Some atoms pull shared electrons toward themselves harder than others. This pull is called <b>electronegativity</b> (the Pauling scale: F 3.98, O 3.44, Cl 3.16, N 3.04, C 2.55, H 2.20, Na 0.93). In a bond between unequal atoms, the electrons sit closer to the more electronegative one, which becomes slightly negative; the other becomes slightly positive. These are <b>partial charges</b>.</p>
<p>Chembox gives each bond a charge shift of 0.33 × (difference in electronegativity). For water this gives oxygen −0.82 and each hydrogen +0.41, close to the values in professional water models.</p>
<p>Switch the colour mode to <b>Charges</b>: red atoms are positive, blue negative.</p>
<h2>Why things stick</h2>
<p>Molecules attract each other even without bonds:</p>
<ul><li>All atoms are slightly sticky at close range (the <b>van der Waals</b> attraction), and push back hard if squeezed (they can't overlap).</li>
<li>Partial charges attract opposite partial charges. When a positive hydrogen on one molecule points at a negative oxygen or nitrogen on another, the attraction is especially strong: a <b>hydrogen bond</b>.</li>
<li>When the electronegativity difference is very large (Na 0.93 vs Cl 3.16), one atom has almost completely taken the other's electron. That's an <b>ionic</b> bond, and the strong + and − ends make the molecules lock into crystals.</li></ul>
${ex(18, 'Water vs methane', `<p>${tryP('methanegas')} Run for 20 ps. Compare the two sides with the colour mode on Charges, then check the gas/liquid/solid bars in Contents.</p>`, `<p>Water molecules stick together into liquid: each has a strongly negative oxygen and two positive hydrogens. Methane barely has any charge and stays a gas. That's why water boils at 100 °C but methane at −162 °C, though the molecules are about the same size.</p>`)}
${ex(19, 'Salt', `<p>${tryP('salt')} Run and watch. Then raise the bath to 1500 K.</p>`, `<p>The NaCl molecules line up + to − and lock into a grid: a crystal. At high temperature it melts and the order disappears (real salt melts at 1074 K).</p>`)}` },

{ id: 'shapes', part: 'Bonds', title: 'Molecule shapes', html: `
<p>Electron pairs around an atom repel each other, so they spread out as far as possible. This includes <b>lone pairs</b>: valence electrons that aren't in a bond. The rule is called VSEPR (valence shell electron pair repulsion):</p>
<table><tr><th>Molecule</th><th>Around the centre</th><th>Angle</th></tr>
<tr><td>CO₂</td><td>2 bonds (both double), no lone pairs</td><td>180°, straight</td></tr>
<tr><td>H₂O</td><td>2 bonds + 2 lone pairs</td><td>104.5°, bent</td></tr>
<tr><td>SO₂, O₃</td><td>2 bonds + 1 lone pair</td><td>about 117–119°</td></tr>
<tr><td>CH₄</td><td>4 bonds</td><td>109.5° in 3D</td></tr></table>
<p>In the flat box, atoms with three or more bonds spread them evenly in the plane (CH₄ looks like a plus sign), like a drawing of a 3D molecule. Two-bond atoms get their real angle, so water is bent and CO₂ is straight.</p>
${ex(20, 'Bent or straight', `<p>Add a water molecule and a carbon dioxide molecule (Molecules panel) to an empty box. Select each and compare.</p>`, `<p>Water is bent; CO₂ is straight. The bend is what gives water its charged "ends", which is why water is so good at dissolving things and sticking to itself.</p>`)}` },

{ id: 'reactions', part: 'Reactions', title: 'Why reactions need a push', html: `
<p>Most molecules are full: every atom has used all its bonds. For anything new to form, a bond must break first, and breaking costs energy. So even a reaction that releases lots of heat overall needs a push to get going. This push is the <b>activation energy</b> (Ea).</p>
<p>Think of a ball in a dip at the top of a hill. Nudge it over the rim and it rolls all the way down; but without the nudge it sits there forever. H₂ and O₂ at room temperature are that ball.</p>
<h2>How reactions happen in Chembox</h2>
<p>The key players are radicals. When a radical hits a full molecule hard enough, it can:</p>
<ul><li><b>steal an atom</b> (abstraction): Cl + H–H → Cl–H + H. A new radical comes out, so the chain continues.</li>
<li><b>open a double bond</b> (addition): H + O=O → H–O–O. The radical attaches and one bond of the double bond opens up, leaving a radical on the far end.</li></ul>
<p>"Hard enough" means: the collision energy along the line between the two atoms must be at least the activation energy. Chembox estimates Ea from the heat of the reaction using the <b>Evans–Polanyi rule</b> (with Semenov's slopes):</p>
<div class="eq">Ea = 30 + 0.25·ΔH   if the reaction releases heat (ΔH &lt; 0)<br>Ea = 30 + 0.75·ΔH   if it takes heat (ΔH &gt; 0)      (kJ/mol)</div>
<p>ΔH is computed from the bond energies: bonds broken minus bonds made. Example: Cl + H₂ → HCl + H breaks H–H (436) and makes H–Cl (431), so ΔH = +5 and Ea ≈ 34 kJ/mol. The measured value is about 18, which shows the rule is only approximate (typically within ±15 kJ/mol).</p>
<p>Every reaction is also checked for energy: the exact energy change is taken from, or given to, the motion of the atoms involved. If they don't have enough, the reaction doesn't happen.</p>
<h2>How often is a collision hard enough?</h2>
<p>Roughly a fraction e^(−Ea/RT) of collisions, where RT is the typical collision energy (R = 0.0083 kJ/mol·K). At 300 K, RT = 2.5 kJ/mol, so for Ea = 30 only about 1 collision in 160,000 succeeds; at 1500 K about 1 in 11. This steep dependence is why heating speeds reactions up so dramatically.</p>
${ex(21, 'Read the log', `<p>${tryP('nacl')} Run it, then open the <b>Reactions</b> tab.</p>`, `<p>You'll see lines like "Na + Cl₂ → NaCl + Cl  releases 170 kJ/mol  barrier 4". Sodium is a radical, Cl–Cl is a weak bond and Na–Cl is strong, so the barrier is tiny and the reaction is fast and very hot, just like the real thing (sodium burns in chlorine with a bright flame).</p>`)}
<div class="note"><b>Time-lapse.</b> Real reactions often need millions of collisions, far more than you can watch. The box inspector has a "Barriers" setting that multiplies every activation energy by 0.8, 0.6 or 0.4 so slow reactions show up in picoseconds. It doesn't change how much heat a reaction releases. The HUD shows when it's on.</div>` },

{ id: 'heat', part: 'Reactions', title: 'Heat and energy', html: `
<p>Energy is never created or destroyed; it only moves between kinds. In the box there are two kinds: <b>kinetic</b> (motion, i.e. temperature) and <b>potential</b> (stored in bonds and attractions). The box inspector shows both, and with insulated walls their total stays the same.</p>
<p>When a bond forms, potential energy goes down (the atoms fall into the Morse valley) and kinetic energy goes up by the same amount. That's where the heat of a fire comes from.</p>
<h2>The third body</h2>
<p>Here's something surprising you can see in Chembox: when two lone atoms bond, the energy they release has nowhere to go but into their own vibration. The new molecule is so hot it shakes itself apart again. It only survives if a <b>third</b> molecule bumps into it and carries some of the energy away. That's real chemistry: atoms in a very thin gas recombine much more slowly because third bodies are rare.</p>
${ex(22, 'Count the energy', `<p>${tryP('h2o2')} Set walls to Insulated (already set). Open the inspector with nothing selected. Spark, run, and watch the three energy numbers.</p>`, `<p>Potential energy drops as water forms, kinetic energy rises by the same amount, the total stays put (to within a few percent, the error of the step-by-step simulation).</p>`)}
<h2>Why flames are hotter in Chembox</h2>
<p>In the flat box each atom can only move in 2 directions instead of 3, so the same released energy is shared among fewer "ways of moving". The temperature rises further: a hydrogen flame in the box can reach 5000–7000 K, where a real one reaches about 3100 K. The chemistry is the same; there's just less room to hide the heat.</p>` },

{ id: 'combustion', part: 'Reactions', title: 'Fire and chain reactions', html: `
<p>Burning is a <b>chain reaction</b>. One radical reacts and makes another; sometimes it makes two (that's called <b>branching</b>), and then the number of radicals grows like an avalanche. For hydrogen, the key steps are:</p>
<table><tr><td>H + O₂ → OH + O</td><td>branching: one radical in, two out (takes heat, needs a hot gas)</td></tr>
<tr><td>O + H₂ → OH + H</td><td>branching again</td></tr>
<tr><td>OH + H₂ → H₂O + H</td><td>makes water and passes the chain on</td></tr>
<tr><td>H + O₂ → HO₂</td><td>a slower path at lower temperature</td></tr></table>
<p>You'll find all of these in the Reactions tab. Chembox wasn't told this mechanism; it comes out of the bond energies.</p>
${ex(23, 'Ignite methane', `<p>${tryP('methane')} Spark several times in different places. Follow the Contents tab.</p>`, `<p>Methane is harder to light than hydrogen: C–H bonds need a radical like OH to break them. You'll see CH₃, then oxygen-containing pieces, then water and eventually CO and CO₂. It's slower; increase the speed or try the Barriers time-lapse at 0.8.</p>`)}
${ex(24, 'Why fires need fuel, oxygen and heat', `<p>Repeat the hydrogen experiment three ways: without O₂ (remove it with the Remove tool before sparking), with walls set to "hold temperature" at 300 K, and with only a few molecules.</p>`, `<p>No oxygen: the spark makes H atoms, which just recombine. Cold walls: the heat leaks away and the chain dies. Few molecules: radicals rarely meet anything. That's the fire triangle: fuel, oxygen, heat.</p>`)}` },

{ id: 'light', part: 'Reactions', title: 'Light and photochemistry', html: `
<p>Light comes in packets called <b>photons</b>, and each photon's energy depends only on its colour (wavelength, λ):</p>
<div class="eq">E = 119,627 / λ    (kJ/mol, λ in nanometres)</div>
<p>Red light (650 nm) carries 184 kJ/mol; violet (400 nm) 299; ultraviolet at 200 nm, 598. If a molecule absorbs a photon with more energy than a bond, the bond can break. But a molecule only absorbs certain colours: chlorine absorbs violet and blue (that's why it looks yellow-green), oxygen only absorbs ultraviolet below 242 nm, nitrogen practically nothing. Chembox uses the long-wavelength edge of each molecule's real absorption band.</p>
<p>Use the <b>Light</b> tool to switch on a lamp above the box and set its colour.</p>
${ex(25, 'Colour matters', `<p>${tryP('hcl')} Turn the lamp on at 650 nm. Run. Then slide it to 450 nm.</p>`, `<p>Red light passes straight through: chlorine doesn't absorb it, even though 184 kJ/mol is less than Cl–Cl (242), so it couldn't break it anyway. At 450 nm (266 kJ/mol) chlorine absorbs, splits into Cl atoms and starts the chain to HCl. Real hydrogen–chlorine mixtures explode in sunlight for exactly this reason.</p>`)}
${ex(26, 'Make an ozone layer', `<p>${tryP('ozone')} Run, then change the lamp to 300 nm.</p>`, `<p>At 200 nm O₂ splits and O + O₂ makes O₃. At 300 nm, O₂ is transparent but ozone still absorbs: ozone soaks up the UV that oxygen lets through. That's exactly the job the ozone layer does for us.</p>`)}` },

{ id: 'states', part: 'Reactions', title: 'Gas, liquid and solid', html: `
<p>Whether something is a gas, liquid or solid is a contest between <b>stickiness</b> (attraction between molecules) and <b>motion</b> (temperature).</p>
<ul><li><b>Gas</b>: molecules fly freely; motion wins.</li>
<li><b>Liquid</b>: molecules stay in contact but slide around each other.</li>
<li><b>Solid</b>: molecules are locked in place, only vibrating.</li></ul>
<p>Chembox decides for each molecule: it's condensed if its attraction to its neighbours is bigger than 2.5 × RT, and solid if it also hasn't wandered more than half an ångström in the last picosecond. The Contents tab shows the result as blue/cyan/white bars.</p>
${ex(27, 'Rain in a box', `<p>${tryP('water')} Run at 1200 K, then lower the temperature to 300 K. Then raise it to 1200 K again.</p>`, `<p>At 1200 K the water is vapour. Cooling makes molecules stick in clumps that fall to the bottom (gravity is on). Heating evaporates it again. (The gas in the box is very dense, which is why it needs more heat to boil than water in a kettle.) Watch the temperature as it condenses: sticking releases heat, so the bath has to carry it away.</p>`)}
<div class="note">A flat world condenses less easily than a 3D one, because each molecule has fewer neighbours. Chembox makes every atom 2.2× stickier than its real-world value to compensate, so boiling points land roughly where they really are. Treat the exact temperatures as approximate.</div>` },

{ id: 'radiobox', part: 'Reactions', title: 'Radioactivity in the box', html: `
<p>Atoms in the box carry their isotope, so radioactive ones (drawn with a dashed orange ring) decay with their real half-lives. Since nothing decays in a few picoseconds, the box inspector has a nuclear clock too.</p>
<p>When a nucleus inside a molecule decays, the element changes in place. If the new element can't make as many bonds, the extra bonds break.</p>
${ex(28, 'Carbon becomes nitrogen', `<p>${tryP('c14')} Run and watch the Contents and Reactions tabs.</p>`, `<p>Each decay turns a carbon-14 into nitrogen-14 inside its methane molecule. Nitrogen can't normally hold 4 hydrogens; you get NH₄ (in real life the ammonium ion, NH₄⁺).</p>`)}
${ex(29, 'Where helium comes from', `<p>${tryP('u238')} Run and watch the helium count.</p>`, `<p>Each alpha decay releases a helium-4 nucleus that becomes a helium atom. Almost all the helium we dig out of the ground was made this way, by uranium and thorium decaying inside the Earth.</p>`)}
<div class="note">Real alpha particles carry about 5 MeV, around ten million times more than a chemical bond. Chembox launches them at 100 kJ/mol so the box doesn't vaporise.</div>` },

{ id: 'model', part: 'Reference', title: 'How Chembox works', html: `
<p>This chapter is the honest list: what is real data, what is a simplified model, and what Chembox doesn't do at all.</p>
<h2>Real data</h2>
<ul><li>Element properties (masses, electronegativities, covalent and van der Waals radii, electron configurations, polarizabilities): the <i>mendeleev</i> database.</li>
<li>3,557 isotopes with measured masses, natural abundances, half-lives and decay-mode branchings.</li>
<li>Ionization energies (NIST) and electron affinities.</li>
<li>Bond energies: standard average bond enthalpies for covalent bonds; measured diatomic values for ionic and metal pairs (NaCl, MgO...). Missing pairs are estimated with Pauling's rule and marked *.</li>
<li>Bond lengths from Pyykkö's covalent radii for single, double and triple bonds.</li>
<li>Photon energies (exact) and the long-wavelength edges of real absorption bands (approximate).</li></ul>
<h2>Models (simplified, but physical)</h2>
<ul><li><b>Motion</b>: Newton's laws, integrated step by step (velocity Verlet, 0.5 fs steps, smaller when atoms move very fast).</li>
<li><b>Bonds</b>: Morse potentials with the real bond energy and length.</li>
<li><b>Between molecules</b>: Lennard-Jones attraction/repulsion (stickiness from polarizability, ×2.2 to make up for the flat world) plus Coulomb forces between partial charges.</li>
<li><b>Valence</b>: each element has its usual bond counts; S, P, Cl and Xe can go higher only with O or F (SO₃, XeF₂).</li>
<li><b>Reactions</b>: radical recombination (no barrier), abstraction and addition with Evans–Polanyi activation energies. Every bond change conserves energy exactly.</li>
<li><b>Shapes</b>: VSEPR angles for two-bond atoms, even spreading for more.</li>
<li><b>Nuclei</b>: real data where it exists, the semi-empirical mass formula elsewhere.</li></ul>
<h2>Special cases</h2>
<ul><li>Carbon monoxide's C≡O counts as complete (in reality there's a dative bond).</li>
<li>Oxygen chains longer than two (O–O–O–O) aren't allowed, except ozone; ozone's bonds get their real "one and a half" bond energy (302 kJ/mol).</li></ul>
<h2>Not simulated</h2>
<ul><li>A third dimension. Molecules are flat drawings; atoms in the same molecule don't bump into each other, only their bonds and angles act.</li>
<li>Free ions and anything that depends on them: dissolving salt in water, acids and bases, pH, electrochemistry, batteries.</li>
<li>Catalysts, metals as metals (a sodium lump is just sticky Na atoms), aromatic stabilisation (benzene is drawn with alternating bonds).</li>
<li>Quantum effects: zero-point vibration, tunnelling, excited electronic states, spin rules. Light either breaks a bond or warms it, nothing in between.</li>
<li>Real time: the box covers picoseconds; real reactions take micro- to milliseconds. Hence the spark, the time-lapse and the nuclear clock.</li>
<li>Pressure is shown as "bar*": the 2D push on the walls divided by an assumed depth of 4 Å. Gases in the box are very dense (hundreds of bar).</li></ul>` },

{ id: 'tools', part: 'Reference', title: 'Tools and shortcuts', html: `
<table><tr><th>Key</th><th>Tool / action</th></tr>
<tr><td><kbd>1</kbd></td><td>Grab: click an atom to inspect its molecule (Alt or Shift for the single atom), drag to pull it. Drag empty space to move the view.</td></tr>
<tr><td><kbd>2</kbd></td><td>Add: drop the element or molecule picked in the side panel. Drag to add several.</td></tr>
<tr><td><kbd>3</kbd></td><td>Remove: click a molecule to delete it.</td></tr>
<tr><td><kbd>4</kbd></td><td>Spark: breaks about half the bonds within 5 Å and heats the spot to 3000 K.</td></tr>
<tr><td><kbd>5</kbd> / <kbd>6</kbd></td><td>Heat / Cool: hold the mouse down to speed up or slow down atoms within 6 Å.</td></tr>
<tr><td><kbd>7</kbd></td><td>Light: switch the lamp on or off and choose its wavelength.</td></tr>
<tr><td><kbd>Space</kbd></td><td>Run / pause</td></tr>
<tr><td><kbd>F</kbd> or double-click</td><td>Fit the box to the window. Scroll to zoom, right-drag to move.</td></tr>
<tr><td><kbd>Delete</kbd></td><td>Remove the selected molecule</td></tr>
<tr><td><kbd>L</kbd> / <kbd>B</kbd></td><td>Atom lab / Reaction box</td></tr>
<tr><td><kbd>P</kbd> <kbd>N</kbd> <kbd>E</kbd></td><td>In the Atom lab: add a proton, neutron or electron (with Shift: remove).</td></tr>
<tr><td><kbd>F1</kbd></td><td>This manual</td></tr></table>
<p><b>Only atoms I've built</b> (Elements panel): turn this on to play it like a game. You can only use elements you've built as neutral atoms in the Atom lab; building one unlocks it.</p>` },
];

</script>
<script>
/* ===== Chembox UI ===== */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pf = f => prettyFormula(f);
function toast(msg, ms = 2600) { const t = $('#toast'); t.innerHTML = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), ms); }
const store = { get(k, d) { try { const v = localStorage.getItem('chembox.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('chembox.' + k, JSON.stringify(v)); } catch (e) {} } };
if (/Electron/.test(navigator.userAgent) && /Mac/.test(navigator.platform)) document.documentElement.classList.add('electron-mac');

/* ---------- bottom panel ---------- */

  const cur = S.mode === 'box' ? S.bTab : S.labTab;

}
function renderBottom() {

    const inv = b.inventory();

    body.innerHTML = `<table class="inv"><tr><th>Substance</th><th>Formula</th><th style="text-align:right">Count</th><th>Gas / liquid / solid</th><th></th></tr>` + inv.map(e => {
      const t = e.phase.gas + e.phase.liquid + e.phase.solid || 1;
      return `<tr data-f="${esc(e.formula)}" class="${e.formula === sel ? 'on' : ''}"><td>${esc(e.name || 'Unnamed')}</td><td class="f">${pf(e.formula)}</td><td class="n">${e.n}</td><td><span class="ph"><i class="g" style="width:${100 * e.phase.gas / t}%"></i><i class="l" style="width:${100 * e.phase.liquid / t}%"></i><i class="s" style="width:${100 * e.phase.solid / t}%"></i></span></td><td>${e.radical ? '<span class="tag" title="Has unpaired electrons: very reactive">radical</span>' : ''}</td></tr>`;
    }).join('') + '</table>' + (inv.length ? '' : '<p class="hint" style="padding:10px">The box is empty. Pick something in Elements or Molecules and use the Add tool.</p>');
    $$('#bottomBody tr[data-f]').forEach(tr => tr.onclick = () => { const f = tr.dataset.f; b.molecules(); for (const c of b.comps) if (b.nameOf(c).formula === f) { S.selId = b.id[c[0]]; S.selAtom = false; break; } renderInsp(); renderBottom(); });
    $('#bInfo') && ($('#bInfo').textContent = 'blue = gas · cyan = liquid · white = solid');
  } else if (S.bTab === 'log') {
    if (LOG.length === S.logSeen && body.firstChild && body.querySelector('.log')) return;
    S.logSeen = LOG.length;
    body.innerHTML = `<div class="log">${LOG.slice().reverse().map(logLine).join('') || '<p class="hint">No reactions yet. Things react when a radical hits something hard enough, when light is absorbed, or when a nucleus decays.</p>'}</div>`;
    $('#bInfo') && ($('#bInfo').textContent = 'newest first');
  } else drawGraph(body);
}
function drawGraph(body) {
  let c = body.querySelector('canvas'); if (!c) { body.innerHTML = '<canvas></canvas>'; c = body.querySelector('canvas'); }
  const r = body.getBoundingClientRect(), W = r.width, H = r.height; c.width = W * DPR; c.height = H * DPR;
  const g = c.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, W, H);
  const h = S.hist; if (h.length < 2) { g.fillStyle = '#5a6470'; g.font = '12px sans-serif'; g.fillText('Run the experiment to see how temperature and the amounts of each substance change.', 14, 24); return; }
  const L = 46, R = W - 170, T = 14, B = H - 22, t0 = h[0].t, t1 = h[h.length - 1].t;
  const X = t => L + (t - t0) / Math.max(1, t1 - t0) * (R - L);
  // temperature (left axis)
  const Tm = Math.max(400, ...h.map(p => p.T)) * 1.05;
  g.strokeStyle = '#29303a'; g.lineWidth = 1; g.beginPath(); g.moveTo(L, T); g.lineTo(L, B); g.lineTo(R, B); g.stroke();
  g.fillStyle = '#8a94a0'; g.font = '10.5px ' + getComputedStyle(document.body).getPropertyValue('--f-mono');
  g.fillText(Math.round(Tm) + ' K', 4, T + 8); g.fillText('0', L - 12, B); g.fillText((t0 / 1000).toFixed(1) + ' ps', L, B + 14); g.fillText((t1 / 1000).toFixed(1) + ' ps', R - 40, B + 14);
  g.strokeStyle = '#ff9a4d'; g.lineWidth = 2; g.beginPath(); h.forEach((p, k) => { const y = B - p.T / Tm * (B - T); k ? g.lineTo(X(p.t), y) : g.moveTo(X(p.t), y); }); g.stroke();
  // species (right scale = counts)
  const tot = {}; h.forEach(p => { for (const f in p.c) tot[f] = Math.max(tot[f] || 0, p.c[f]); });
  const top = Object.keys(tot).sort((a, b) => tot[b] - tot[a]).slice(0, 6), Cm = Math.max(...top.map(f => tot[f]), 1) * 1.1;
  const cols = ['#5cc8e6', '#5fd38d', '#b593f2', '#ffc58f', '#e8604f', '#7fb3f5'];
  top.forEach((f, k) => { g.strokeStyle = cols[k]; g.lineWidth = 1.6; g.beginPath(); h.forEach((p, j) => { const y = B - (p.c[f] || 0) / Cm * (B - T); j ? g.lineTo(X(p.t), y) : g.moveTo(X(p.t), y); }); g.stroke(); });
  g.fillStyle = '#ff9a4d'; g.fillText('— temperature', R + 12, T + 8);
  top.forEach((f, k) => { g.fillStyle = cols[k]; g.fillText('— ' + pf(f) + '  (max ' + tot[f] + ')', R + 12, T + 24 + k * 15); });
}

/* ---------- inspector ---------- */
function renderInsp(soft) {

  const b = S.box, body = $('#inspBody');
  if (soft && document.activeElement && body.contains(document.activeElement) && /INPUT|SELECT/.test(document.activeElement.tagName)) return;
  const i = S.selId ? b.indexOfId(S.selId) : -1;
  if (i < 0) { $('#inspTitle').textContent = 'The box'; return boxSettings(body, soft); }
  b.molecules(); const list = S.selAtom ? [i] : b.comps[b.comp[i]], nm = b.nameOf(b.comps[b.comp[i]]);
  $('#inspTitle').textContent = S.selAtom ? 'Atom' : 'Molecule';
  let mass = 0; for (const a of b.comps[b.comp[i]]) mass += b.m[a];
  const ph = b.phaseOf && b.phaseOf[b.comp[i]] || 'gas';
  let KE = 0; for (const a of list) KE += 0.5 * b.m[a] * (b.vx[a] ** 2 + b.vy[a] ** 2) * 1e4;
  let h = '';
  if (S.selAtom) {
    const e = ELZ[b.Z[i]], A = b.A[i], info = nucleusInfo(b.Z[i], A - b.Z[i]);
    h += `<h2>${esc(e.n)}-${A}</h2><div class="kind">${e.s} · ${b.Z[i]} protons, ${A - b.Z[i]} neutrons · ${b.m[i].toFixed(3)} g/mol</div>`;
    h += `<div class="kv"><span>part of</span><span>${esc(nm.name || pf(nm.formula))}</span><span>bonds used</span><span>${b.sum[i]}</span><span>free bonds (radical)</span><span>${b.fv[i]}</span><span>partial charge</span><span>${b.q[i] >= 0 ? '+' : ''}${b.q[i].toFixed(2)} e</span><span>electronegativity</span><span>${e.en ?? '—'}</span><span>its own "temperature"</span><span>${Math.round(KE / R_GAS)} K</span><span>nucleus</span><span>${info.kind === 'stable' ? 'stable' : info.kind === 'radio' ? 'radioactive, half-life ' + (info.hl ? fmtTime(info.hl) : '?') : info.kind}</span></div>`;
    h += `<p class="hint" style="margin:8px 0">Alt-click (or Shift-click) picks a single atom; a plain click picks its whole molecule.</p>`;
  } else {
    h += `<h2>${esc(nm.name || 'Unnamed molecule')}</h2><div class="kind">${pf(nm.formula)} · ${mass.toFixed(2)} g/mol · ${list.length} atoms · ${ph}</div>`;
    if (!nm.known) h += `<p>Chembox doesn't have a name for this one. It may be a real but unusual molecule, or one that only exists for an instant.</p>`;
    if (nm.radical) h += `<div class="stab rad"><b>Radical</b>It has unpaired electrons (the cyan dots), so it reacts with almost anything it bumps into.</div>`;
    const bonds = b.bonds.filter(q => list.includes(q.i) && list.includes(q.j));
    if (bonds.length) {
      h += `<h4>Bonds</h4><div class="bl">`;
      let tot = 0;
      for (const q of bonds) { const r = Math.hypot(b.x[q.j] - b.x[q.i], b.y[q.j] - b.y[q.i]); tot += q.p.D[q.o];
        h += `<span>${b.sym(q.i)}${['', '–', '=', '≡'][q.o]}${b.sym(q.j)}</span><span class="${q.p.est[q.o] ? 'est' : ''}" title="${q.p.est[q.o] ? 'estimated with Pauling\'s rule' : 'measured average'}">${q.p.D[q.o]} kJ/mol${q.p.est[q.o] ? '*' : ''}${q.p.ozone ? ' (ozone)' : ''}</span><span>${r.toFixed(2)} Å</span>`; }
      h += `<span style="color:var(--dim)">total</span><span>${tot} kJ/mol</span><span></span></div><p class="hint" style="margin:6px 0">Bond energy = what it costs to pull the two atoms apart. ${bonds.some(q => q.p.est[q.o]) ? '* estimated (no measured value in the table).' : ''}</p>`;
    }
    h += `<h4>Atoms</h4><div class="bl">` + list.slice(0, 40).map(a => `<span>${b.sym(a)}${b.A[a] !== commonIsotope(b.Z[a]) ? '-' + b.A[a] : ''}</span><span>charge ${b.q[a] >= 0 ? '+' : ''}${b.q[a].toFixed(2)}</span><span>${b.fv[a] ? b.fv[a] + ' free' : ''}</span>`).join('') + '</div>';
    h += `<div class="row"><button class="btn" id="iMore">Add more of these</button><button class="btn" id="iDel">Remove it</button></div>`;
  }
  body.innerHTML = h;
  const more = $('#iMore'); if (more) more.onclick = () => { const g = b.molGraph(b.comps[b.comp[i]]); S.item = { kind: 'mol', smi: null, graph: g, name: nm.name || nm.formula }; setTool('add'); toast('Click in the box to add more ' + esc(nm.name || pf(nm.formula))); };
  const del = $('#iDel'); if (del) del.onclick = () => { eraseAt(b.x[i], b.y[i]); S.selId = 0; renderInsp(); };
}
function boxSettings(body, soft) {

  <h4>Energy right now</h4><div class="kv"><span>temperature</span><span id="bsT">${Math.round(st.T)} K</span><span>motion (kinetic)</span><span id="bsK">${st.K.toFixed(0)}</span><span>bonds &amp; attractions (potential)</span><span id="bsU">${st.U.toFixed(0)}</span><span class="tot">total, kJ/mol</span><span class="tot" id="bsE">${st.E.toFixed(0)}</span></div>

  <h4>Heat</h4><div class="props">

    <label>Gravity</label><span><input type="checkbox" id="bsGrav" ${b.gravity ? 'checked' : ''}> pull things down (exaggerated)</span>
  </div>
  <h4>Chemistry speed</h4><div class="props">
    <label>Barriers</label><select id="bsEa"><option value="1">Real activation energies</option><option value="0.8">Time-lapse ×0.8</option><option value="0.6">Time-lapse ×0.6</option><option value="0.4">Time-lapse ×0.4</option></select>
  </div><p class="hint" style="margin:4px 0">Real reactions can take millions of collisions. Time-lapse lowers every activation energy so you see them in picoseconds. It doesn't change how much heat a reaction gives.</p>

  </div>

  $('#bsEa').value = String(b.eaScale);

  $('#bsGrav').onchange = e => { b.gravity = e.target.checked; };

  $('#bsClear').onclick = () => { while (b.n) b.removeAtom(b.n - 1); b.photons = []; b.listDirty = true; renderInsp(); };

/* ---------- side panels ---------- */
const PT_POS = (() => {   // [row, col] for the periodic table (lanthanides/actinides in rows 8-9)
  const m = {}; for (const e of ELEMENTS) {
    let r = e.p, c = e.g;
    if (e.z >= 57 && e.z <= 71) { r = 8; c = e.z - 57 + 3; } else if (e.z >= 89 && e.z <= 103) { r = 9; c = e.z - 89 + 3; }
    if (c == null) continue; m[e.z] = [r, c];
  } return m;
})();
function periodicTable(selZ, onPick) {
  let h = '<div class="ptab">';
  const grid = {}; for (const z in PT_POS) { const [r, c] = PT_POS[z]; grid[r + ',' + c] = +z; }
  for (let r = 1; r <= 9; r++) {
    if (r === 8) h += '<div style="grid-column:1/-1;height:4px"></div>';
    for (let c = 1; c <= 18; c++) {
      const z = grid[r + ',' + c];
      if (!z) { h += '<span class="gap"></span>'; continue; }
      const e = ELZ[z], off = S.mode === 'box' && S.builtOnly && !S.built.has(z);
      h += `<button class="el ${z === selZ ? 'on' : ''} ${off ? 'off' : ''} ${S.built.has(z) ? 'built' : ''}" style="--c:${e.c}" data-z="${z}" title="${e.n} (${z})${S.built.has(z) ? ' · built in the Atom lab' : ''}">${e.s}</button>`;
    }
  }
  return h + '</div>';
}
function renderSide() {
  const body = $('#sideBody'), p = S.panel;
  $('#sideTitle').textContent = { elements: 'Elements', molecules: 'Molecules', presets: 'Experiments', manual: 'Manual' }[p];
  if (p === 'elements') {
    const selZ = S.mode === 'lab' ? S.lab.z : S.item.kind === 'el' ? EL[S.item.sym].z : 0;
    let h = S.mode === 'lab' ? '<p class="hint">Jump to any element: the lab builds its most common isotope. Or build up from protons yourself.</p>'
      : '<p class="hint">Pick an element, then click in the box with the Add tool.</p>';
    h += periodicTable(selZ);
    if (S.mode === 'box') {
      h += `<label class="hint" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="chkBuilt" ${S.builtOnly ? 'checked' : ''}> Only atoms I've built in the Atom lab (${S.built.size} so far)</label>`;
      if (S.item.kind === 'el') h += elementCard(S.item.sym);
    }
    body.innerHTML = h;
    $$('#sideBody .el').forEach(x => x.onclick = () => {
      const z = +x.dataset.z;
      if (S.mode === 'lab') { setLab(z, commonIsotope(z) - z, z); renderSide(); }
      else { S.item = { kind: 'el', sym: ELZ[z].s, A: null }; if (S.tool !== 'add') setTool('add'); renderSide(); }
    });
    const cb = $('#chkBuilt'); if (cb) cb.onchange = () => { S.builtOnly = cb.checked; store.set('builtOnly', S.builtOnly); renderSide(); };
    $$('#sideBody .isos button').forEach(x => x.onclick = () => { S.item.A = +x.dataset.a || null; renderSide(); if (S.tool !== 'add') setTool('add'); });
  } else if (p === 'molecules') {
    const q = S.molSearch.toLowerCase();
    const seen = new Set(), list = [];
    for (const [smi, name] of COMPOUNDS) { if (seen.has(name)) continue; seen.add(name); const g = parseSmiles(smi); list.push({ smi, name, f: formulaOf(g.atoms.map(a => ({ s: a.s }))) }); }
    list.sort((a, b) => a.name.localeCompare(b.name));
    const shown = list.filter(m => !q || m.name.toLowerCase().includes(q) || m.f.toLowerCase().includes(q));
    body.innerHTML = `<div class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="molQ" placeholder="Search name or formula" value="${esc(S.molSearch)}"></div>
      <p class="hint">${list.length} real compounds Chembox recognises. Pick one, then click in the box with Add. You can also build them atom by atom.</p>
      <div class="mlist">${shown.map(m => `<button class="m ${S.item.kind === 'mol' && S.item.smi === m.smi ? 'on' : ''}" data-s="${esc(m.smi)}">${esc(m.name)}<span class="f">${pf(m.f)}</span></button>`).join('')}</div>`;
    const inp = $('#molQ'); inp.oninput = () => { S.molSearch = inp.value; renderSide(); const i2 = $('#molQ'); i2.focus(); i2.setSelectionRange(i2.value.length, i2.value.length); };
    $$('#sideBody .m').forEach(x => x.onclick = () => { const m = list.find(m => m.smi === x.dataset.s); S.item = { kind: 'mol', smi: m.smi, name: m.name }; if (S.mode !== 'box') setMode('box'); setTool('add'); renderSide(); });
  } else if (p === 'presets') {

    body.innerHTML = h + '</div>';
    $$('#sideBody .p').forEach(x => x.onclick = () => { if (S.mode !== 'box') setMode('box'); loadPreset(x.dataset.id); showPresetText(); });
  } else if (p === 'manual') {
    let h = '<div class="toc">', part = null;
    for (const d of DOCS) { if (d.part !== part) { part = d.part; h += `<div class="part">${esc(part)}</div>`; } h += `<a href="#" data-id="${d.id}" class="${S.docId === d.id ? 'on' : ''}">${esc(d.title)}</a>`; }
    body.innerHTML = h + '</div>';
    $$('#sideBody .toc a').forEach(a => a.onclick = e => { e.preventDefault(); openDoc(a.dataset.id); });
  }
}
function elementCard(sym) {

    <div class="kv" style="margin-top:6px"><span>protons</span><span>${e.z}</span><span>atomic mass</span><span>${e.m ?? '—'}</span><span>usual bonds</span><span>${lv[0]}${lv.length > 1 ? ' (up to ' + lv[lv.length - 1] + ' with O/F)' : ''}</span><span>electronegativity</span><span>${e.en ?? '—'}</span></div>
    <div class="isos">${isos.map(i => `<button data-a="${i.a}" class="${(S.item.A || commonIsotope(e.z)) === i.a ? 'on' : ''} ${i.hl ? 'rad' : ''}" title="${i.ab ? i.ab + '% of natural ' + e.n : 'radioactive, half-life ' + (i.hl > 0 ? fmtTime(i.hl) : '?')}">${e.s}-${i.a}</button>`).join('')}</div></div>`;

      return `<div class="sub"><div class="boxes">${boxes.map(x => `<span class="bx">${x}</span>`).join('')}</div><span class="nm">${o}</span></div>`; }).join('')}</div>`;
