  if (e) h += `<h4>Element</h4><div class="kv"><span>electronegativity</span><span>${e.en ?? '—'}</span><span>atomic mass (natural mix)</span><span>${e.m ?? '—'}</span><span>discovered</span><span>${e.yr || 'ancient'}</span></div>`;

}
function renderLabBottom(body) {
  if (S.labTab === 'labLog') {
    body.innerHTML = `<div class="log">${L.log.slice().reverse().map(x => `<div class="e"><span class="t">${x.instant ? 'instantly' : fmtTime(x.t)}</span><span class="d">${x.from} → ${x.to}</span><span style="color:var(--faint)">${modeText(x.mode)}</span></div>`).join('') || '<p class="hint">No decays yet. Build a radioactive isotope (try carbon-14 or uranium-238) and speed up the nuclear clock.</p>'}</div>`;

  }

  const r = body.getBoundingClientRect(), W = r.width, H = r.height; c.width = W * DPR; c.height = H * DPR;
  const g = c.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, W, H);
  const mono = getComputedStyle(document.body).getPropertyValue('--f-mono');
  if (S.labTab === 'chart') {

    const cs = 9, nx = Math.floor((W - 60) / cs), ny = Math.floor((H - 26) / cs);
    const n0 = Math.max(0, L.n - (nx >> 1)), z0 = Math.max(0, L.z - (ny >> 1));
    c._map = { cs, n0, z0, ny, ox: 40, oy: 8 };
    for (const k in ISO) { const s = ISO[k]; const n = s.a - s.z; if (n < n0 || n >= n0 + nx || s.z < z0 || s.z >= z0 + ny) continue;
      const X = 40 + (n - n0) * cs, Y = 8 + (ny - 1 - (s.z - z0)) * cs;
      g.fillStyle = s.hl == null ? '#e4e8e3' : s.hl < 0 ? '#3a4450' : hlColor(s.hl); g.fillRect(X, Y, cs - 1, cs - 1); }
    const X = 40 + (L.n - n0) * cs, Y = 8 + (ny - 1 - (L.z - z0)) * cs;
    g.strokeStyle = '#5cc8e6'; g.lineWidth = 2; g.strokeRect(X - 1.5, Y - 1.5, cs + 2, cs + 2);
    g.fillStyle = '#8a94a0'; g.font = '10px ' + mono;
    for (let z = z0; z < z0 + ny; z += 5) g.fillText(z, 8, 8 + (ny - 1 - (z - z0)) * cs + 8);
    for (let n = n0 - n0 % 10 + 10; n < n0 + nx; n += 10) g.fillText(n, 40 + (n - n0) * cs, H - 14);
    const lx = W - 120; [['stable', '#e4e8e3'], ['> 1 million yr', hlColor(4e13)], ['years', hlColor(3e8)], ['days', hlColor(3e5)], ['seconds', hlColor(5)], ['< 1 ms', hlColor(1e-5)], ['not measured', '#3a4450']].forEach(([t, col], i) => { g.fillStyle = 'rgba(23,27,32,.85)'; g.fillRect(lx - 4, 4 + i * 14, 120, 14); g.fillStyle = col; g.fillRect(lx, 7 + i * 14, 9, 9); g.fillStyle = '#8a94a0'; g.fillText(t, lx + 14, 15 + i * 14); });
    $('#bInfo') && ($('#bInfo').textContent = 'every known nucleus · up = more protons · right = more neutrons · click one to build it');
  } else {
    const L0 = 50, R0 = W - 20, T0 = 26, B0 = H - 24, X = a => L0 + a / 260 * (R0 - L0), Y = v => B0 - v / 9.5 * (B0 - T0);
    g.strokeStyle = '#29303a'; g.beginPath(); g.moveTo(L0, T0); g.lineTo(L0, B0); g.lineTo(R0, B0); g.stroke();
    g.fillStyle = '#8a94a0'; g.font = '10px ' + mono; g.fillText('MeV', 14, T0 + 4); g.fillText('/nucleon', 2, T0 + 16); g.fillText('mass number →', R0 - 90, H - 6);
    for (const v of [2, 4, 6, 8]) { g.fillText(v, L0 - 14, Y(v) + 3); }
    for (const k in ISO) { const s = ISO[k]; if (!s.mass || s.a < 2) continue; const B = realB(s.z, s.a) / s.a; if (!(B > 0)) continue; g.fillStyle = s.hl == null ? '#e4e8e3' : 'rgba(255,197,143,.35)'; g.fillRect(X(s.a) - 1, Y(B) - 1, 2, 2); }
    if (L.z + L.n > 1) { const b = bindingE(L.z, L.z + L.n); if (isFinite(b.B) && b.B > 0) { g.strokeStyle = '#5cc8e6'; g.lineWidth = 2; g.beginPath(); g.arc(X(L.z + L.n), Y(b.B / (L.z + L.n)), 6, 0, 7); g.stroke(); } }
    g.fillStyle = '#8a94a0'; g.fillText('Peak near iron-56 / nickel-62: the most tightly bound nuclei. Lighter ones release energy by fusing, heavier ones by splitting.', L0 + 8, 12);
    $('#bInfo') && ($('#bInfo').textContent = 'white = stable · orange = radioactive · cyan ring = yours');

function modeShares(modes) {   // same branching rule as pickMode: if the table's numbers add to more than 100%, the biggest one is exact
  const list = modes.filter(m => !m[3]).map(m => [m[0], m[1] == null ? 0 : m[1]]).sort((a, b) => b[1] - a[1]);
  const tot = list.reduce((s, m) => s + m[1], 0);
  if (tot > 100.5) { const rest = Math.max(0, 100 - list[0][1]), ot = tot - list[0][1]; return list.map((m, i) => [m[0], i === 0 ? m[1] : ot > 0 ? rest * m[1] / ot : 0]); }
  return list;
}
function hlColor(hl) { const l = Math.log10(hl); const t = Math.max(0, Math.min(1, (l + 6) / 22)); return `hsl(${Math.round(280 - 250 * t)},70%,${Math.round(45 + 10 * t)}%)`; }
function chartClick(e) {
  if (S.labTab !== 'chart') return; const c = e.target, m = c._map; if (!m) return;
  const r = c.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const n = m.n0 + Math.floor((x - m.ox) / m.cs), z = m.z0 + (m.ny - 1 - Math.floor((y - m.oy) / m.cs));
  if (n >= 0 && z >= 0) setLab(z, n, z);
}

/* ---------- manual ---------- */
function openDoc(id) {
  const d = DOCS.find(d => d.id === id) || DOCS[0]; S.docId = d.id;
  const k = DOCS.indexOf(d), prev = DOCS[k - 1], next = DOCS[k + 1];
  $('#docInner').innerHTML = `<div class="kind" style="color:var(--faint);font:11px var(--f-mono)">${esc(d.part)}</div><h1>${esc(d.title)}</h1>${d.html}<div class="nav">${prev ? `<a href="#" data-id="${prev.id}">← ${esc(prev.title)}</a>` : '<span></span>'}${next ? `<a href="#" data-id="${next.id}">${esc(next.title)} →</a>` : ''}</div>`;
  $('#doc').hidden = false; $('#doc').scrollTop = 0;
  $$('#docInner .nav a').forEach(a => a.onclick = e => { e.preventDefault(); openDoc(a.dataset.id); });
  $$('#docInner [data-preset]').forEach(x => x.onclick = () => { closeDoc(); setMode('box'); loadPreset(x.dataset.preset); showPresetText(); });
  $$('#docInner [data-lab]').forEach(x => x.onclick = () => { closeDoc(); setMode('lab'); const [z, n] = x.dataset.lab.split(',').map(Number); setLab(z, n, x.dataset.e != null ? +x.dataset.e : z); });
  $$('#docInner [data-doc]').forEach(x => x.onclick = e => { e.preventDefault(); openDoc(x.dataset.doc); });
